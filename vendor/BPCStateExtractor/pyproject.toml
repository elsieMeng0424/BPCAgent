[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpc-patient-state"
version = "0.3.0"
description = "Deterministic, cutoff-safe patient-state extraction for GENIE BPC releases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
bpc_state_extractor = "bpc_state_extractor.cli:main"

[tool.setuptools]
package-dir = {"" = "src", "bpc_state_extractor.resources" = "config"}
packages = ["bpc_state_extractor", "bpc_state_extractor.resources"]

[tool.setuptools.package-data]
"bpc_state_extractor.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
